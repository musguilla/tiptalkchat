# TipTalk local dev stack.
# Run: docker compose up
# Then in another terminal: pnpm dev   (web + api + realtime + worker)
#
# For a single-command "just run everything", uncomment the app services
# at the bottom — they need a Dockerfile per app, which is documented in
# ARCHITECTURE.md (Phase 2 work).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiptalk
      POSTGRES_PASSWORD: tiptalk
      POSTGRES_DB: tiptalk
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiptalk -d tiptalk']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # Web console
    volumes:
      - minio_data:/data

  minio_setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 3 &&
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb -p local/tiptalk-media || true &&
        mc anonymous set download local/tiptalk-media
      "

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --no-auth
      --no-cli
      --no-tls
      --no-dtls
      --realm=tiptalk.local
      --listening-port=3478
      --min-port=49160 --max-port=49200
      --user=tiptalk:tiptalkpass
      --lt-cred-mech
    # In production, swap --no-auth for --use-auth-secret + --static-auth-secret
    # and front with TLS via Caddy or run with --cert/--pkey.

volumes:
  postgres_data:
  minio_data:

