name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tip
          POSTGRES_PASSWORD: tip
          POSTGRES_DB: tiptalk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tip -d tiptalk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tip:tip@localhost:5432/tiptalk_test
      DATABASE_URL_TEST: postgresql://tip:tip@localhost:5432/tiptalk_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @tiptalk/db prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + integration)
        run: pnpm test
